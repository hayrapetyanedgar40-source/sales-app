name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js && cp node_modules/@capacitor/filesystem/dist/plugin.js www/filesystem.js && cp node_modules/@capacitor/share/dist/plugin.js www/share.js
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: sales-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
