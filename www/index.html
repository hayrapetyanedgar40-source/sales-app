<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<title>Վաճառքի մատյան</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302b;--mute:#5d716c;--line:#d9e2de;--accent:#0b7a63;--accent-ink:#fff;--warn:#b4491f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#17262a;--ink:#e6f0ec;--mute:#93a8a2;--line:#27403b;--accent:#3fc7a5;--accent-ink:#06231c;--warn:#f0905f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Armenian",system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:4px 0 14px}
h2{font-size:17px;font-weight:600;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row>*{flex:1 1 120px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:2px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
input[type=checkbox]{width:auto}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 10px;font-weight:400}
button.on{outline:2px solid var(--accent)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
small{color:var(--mute);display:block}
.amt{font-weight:800;white-space:nowrap}
.low{color:var(--warn);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:16px}
.stat span{font-size:12px;color:var(--mute)}
.empty{color:var(--mute);padding:8px 0}
.qty{width:84px;flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{flex:1;padding:8px 4px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
details>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:10px}
details .card{background:var(--bg)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:0 0 auto;background:none;color:var(--mute);font-size:13px;padding:8px 12px;font-weight:400;white-space:nowrap}
nav button.on{color:var(--accent);font-weight:800;outline:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.ov>div{background:var(--card);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
pre{white-space:pre-wrap;font:14px/1.5 monospace;margin:0 0 12px}
svg text{fill:var(--mute);font-size:9px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"></div>
<script>
var KEY="sales-app-v2",tab="sales",S={products:[],customers:[],orders:[]};
var DAYS=["Երկ","Երք","Չրք","Հնգ","Ուրբ","Շաբ"];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return Math.round(n).toLocaleString("ru-RU")+" ֏"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function n2(x){return String(x).padStart(2,"0")}
function dkey(d){d=new Date(d);return d.getFullYear()+"-"+n2(d.getMonth()+1)+"-"+n2(d.getDate())}
function dshort(d){d=new Date(d);return n2(d.getDate())+"."+n2(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2)}
function dfull(d){d=new Date(d);return n2(d.getDate())+"."+n2(d.getMonth()+1)+"."+d.getFullYear()+" "+n2(d.getHours())+":"+n2(d.getMinutes())}
function prod(id){return S.products.find(function(p){return p.id===id})}
function cust(id){return S.customers.find(function(c){return c.id===id})}
function paid(o){return o.pays.reduce(function(a,p){return a+p.amt},0)}
function debt(o){return Math.max(0,o.total-paid(o))}
function custDebt(id){var t=0;S.orders.forEach(function(o){if(o.cid===id)t+=debt(o)});return t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY)||localStorage.getItem("sales-app-v1");if(!r)return;var d=JSON.parse(r);
 S.products=d.products||[];S.customers=d.customers||[];S.orders=d.orders||[];
 if(d.sales&&!d.orders){var m={};d.sales.slice().reverse().forEach(function(s){var k=s.oid||s.id,o=m[k];if(!o){o=m[k]={id:k,date:s.date,cid:s.cid,cname:s.cname,items:[],disc:0,pays:[]};S.orders.unshift(o)}o.items.push({pid:s.pid,name:s.name,qty:s.qty,price:s.price})});
  S.orders.forEach(function(o){o.total=o.items.reduce(function(a,s){return a+s.qty*s.price},0);o.pays=[{date:o.date,amt:o.total}]})}
}catch(e){}}
load();
var TABS=[["sales","Վաճառք"],["route","Երթուղի"],["debts","Պարտքեր"],["cal","Օրացույց"],["cust","Հաճախորդներ"],["stock","Պաշար"],["report","Հաշվետվություն"]];
function go(t){tab=t;render()}
function render(){
 $("nav").innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
 $("app").innerHTML=({sales:vSales,route:vRoute,debts:vDebts,cal:vCal,cust:vCust,stock:vStock,report:vReport})[tab]();
 var a=({sales:afterSales,cust:drawCust,stock:drawStock})[tab];if(a)a();
 window.scrollTo(0,0);
}
function openOv(h){$("ov").innerHTML='<div class="ov" onclick="if(event.target===this)closeOv()"><div>'+h+'</div></div>'}
function closeOv(){$("ov").innerHTML=""}
/* ---------- share / export ---------- */
function plug(){return window.Capacitor&&window.Capacitor.Plugins}
async function shareFile(name,text){
 var P=plug();
 try{if(P&&P.Filesystem&&P.Share){var r=await P.Filesystem.writeFile({path:name,data:text,directory:"CACHE",encoding:"utf8"});await P.Share.share({title:name,url:r.uri,dialogTitle:"Ուղարկել"});return}}
 catch(e){if(/cancel/i.test(String(e&&e.message||e)))return}
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
async function shareText(t){
 var P=plug();
 try{if(P&&P.Share){await P.Share.share({text:t});return}if(navigator.share){await navigator.share({text:t});return}}catch(e){return}
 try{await navigator.clipboard.writeText(t);alert("Պատճենվեց")}catch(e){}
}
function csvCell(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
function exportCSV(list,name){
 var rows=[["Ամսաթիվ","Ժամ","Հաճախորդ","ՀՎՀՀ","Ապրանք","Քանակ","Գին","Զեղչ %","Պատվերի գումար","Վճարված","Պարտք"]];
 list.forEach(function(o){var c=cust(o.cid),d=new Date(o.date);
  o.items.forEach(function(s,i){rows.push([dshort(d),n2(d.getHours())+":"+n2(d.getMinutes()),o.cname||"",c?c.tin:"",s.name,s.qty,s.price,o.disc||0,i?"":o.total,i?"":paid(o),i?"":debt(o)])})});
 shareFile(name+".csv","\uFEFFsep=;\n"+rows.map(function(r){return r.map(csvCell).join(";")}).join("\n"));
}
function backup(){shareFile("backup-"+dkey(new Date())+".json",JSON.stringify(S))}
function restore(inp){
 var f=inp.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var d=JSON.parse(r.result);if(!d.products||!d.customers||!d.orders)throw 0;
  if(!confirm("Ընթացիկ բոլոր տվյալները կփոխարինվեն պահուստով։ Շարունակե՞լ։"))return;
  S={products:d.products,customers:d.customers,orders:d.orders};save();render();alert("Տվյալները վերականգնվեցին")}catch(e){alert("Ֆայլը ճիշտ պահուստ չէ")}};
 r.readAsText(f);
}
/* ---------- orders ---------- */
function ordersHTML(list,showC){
 if(!list.length)return '<div class="empty">Պատվերներ դեռ չկան։</div>';
 return list.map(function(o){var q=0,d=debt(o);o.items.forEach(function(s){q+=s.qty});
  return '<div class="card"><div class="item"><div><b>'+dfull(o.date)+'</b><small>'+(showC&&o.cname?esc(o.cname)+" · ":"")+q+' հատ'+(o.disc?" · զեղչ "+o.disc+"%":"")+'</small></div><span class="amt">'+fmt(o.total)+'</span></div>'
  +o.items.map(function(s){return '<div class="item"><div>'+esc(s.name)+'</div><div>'+s.qty+' × '+fmt(s.price)+'</div></div>'}).join("")
  +o.pays.map(function(p){return '<div class="item"><small>Վճարում՝ '+dfull(p.date)+'</small><div>'+fmt(p.amt)+'</div></div>'}).join("")
  +'<div class="item"><div>'+(d>0?'<span class="low">Պարտք՝ '+fmt(d)+'</span>':'Մարված է')+'</div><div><button class="ghost" onclick="rcpt(\''+o.id+'\')">Անդորրագիր</button> <button class="ghost" onclick="delOrder(\''+o.id+'\')">Ջնջել</button></div></div></div>'}).join("");
}
var orderCid=null,preCid=null,lastRcpt="";
function vSales(){
 if(!S.products.length)return '<h1>Նոր պատվեր</h1><div class="card empty">Սկզբում «Պաշար» բաժնում ավելացրեք ապրանքներ։</div>';
 return '<h1>Նոր պատվեր</h1><div class="card"><label>Հաճախորդ</label><select id="sc" onchange="setCust(this.value)"><option value="__">Ընտրեք հաճախորդին…</option><option value="">Առանց հաճախորդի</option>'+S.customers.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select><div id="pick"></div></div>';
}
function afterSales(){orderCid=null;if($("sc")&&preCid){$("sc").value=preCid;setCust(preCid)}preCid=null}
function setCust(v){orderCid=v;drawPick()}
function drawPick(){
 var el=$("pick");if(orderCid===null||orderCid==="__"){el.innerHTML="";return}
 var cs={};S.products.forEach(function(p){var k=p.cat||"Ընդհանուր";(cs[k]=cs[k]||[]).push(p)});
 var h='';
 Object.keys(cs).forEach(function(k){h+='<h2>'+esc(k)+'</h2>'+cs[k].map(function(p){return '<div class="item"><div>'+esc(p.name)+'<small>'+fmt(p.price)+' · պաշար՝ '+p.stock+'</small></div><input class="qty" type="number" min="0" max="'+p.stock+'" value="0" data-id="'+p.id+'" oninput="sumPick()" '+(p.stock?"":"disabled")+'></div>'}).join("")});
 h+='<div class="row"><div><label>Զեղչ (%)</label><input id="dc" type="number" min="0" max="100" value="0" oninput="sumPick()"></div><div><label>Վճարված (դատարկ՝ ամբողջը)</label><input id="pd" type="number" min="0" oninput="sumPick()"></div></div><div id="sum" style="margin:10px 0"></div><div id="serr" class="low"></div><button style="width:100%;margin-top:8px" onclick="addOrder()">Գրանցել պատվերը</button>';
 el.innerHTML=h;sumPick();
}
function calc(){
 var L=[],q=0,sub=0;document.querySelectorAll("#pick .qty").forEach(function(i){var n=Math.floor(+i.value);if(n>0){var p=prod(i.getAttribute("data-id"));L.push({p:p,q:n});q+=n;sub+=n*p.price}});
 var dc=Math.min(100,Math.max(0,+$("dc").value||0)),tot=Math.round(sub*(1-dc/100)),pv=$("pd").value,pd=pv===""?tot:Math.min(tot,Math.max(0,+pv));
 return{L:L,q:q,sub:sub,dc:dc,tot:tot,pd:pd};
}
function sumPick(){var c=calc();$("sum").innerHTML='<b>'+c.q+' հատ · '+fmt(c.tot)+'</b>'+(c.dc?'<small>Զեղչից առաջ՝ '+fmt(c.sub)+'</small>':'')+(c.tot>c.pd?'<div class="low">Պարտք՝ '+fmt(c.tot-c.pd)+'</div>':'')}
function addOrder(){
 var c=calc();if(!c.L.length){$("serr").textContent="Նշեք առնվազն մեկ ապրանքի քանակ։";return}
 for(var i=0;i<c.L.length;i++)if(c.L[i].q>c.L[i].p.stock){$("serr").textContent=c.L[i].p.name+"՝ պաշարում կա միայն "+c.L[i].p.stock+" հատ։";return}
 if(c.tot>c.pd&&!orderCid){$("serr").textContent="Պարտքով վաճառքի համար ընտրեք հաճախորդ։";return}
 var cu=cust(orderCid),now=new Date().toISOString();
 var o={id:uid(),date:now,cid:orderCid||"",cname:cu?cu.name:"",items:c.L.map(function(x){x.p.stock-=x.q;return{pid:x.p.id,name:x.p.name,qty:x.q,price:x.p.price}}),disc:c.dc,total:c.tot,pays:c.pd>0?[{date:now,amt:c.pd}]:[]};
 S.orders.unshift(o);save();render();rcpt(o.id);
}
function delOrder(id){
 if(!confirm("Ջնջե՞լ պատվերը։ Ապրանքները կվերադարձվեն պաշար։"))return;
 var o=S.orders.find(function(x){return x.id===id});if(!o)return;
 o.items.forEach(function(s){var p=prod(s.pid);if(p)p.stock+=s.qty});
 S.orders=S.orders.filter(function(x){return x.id!==id});save();render();
}
function rcpt(id){
 var o=S.orders.find(function(x){return x.id===id});if(!o)return;var c=cust(o.cid),L="-----------------";
 var t=["Անդորրագիր",dfull(o.date)];
 if(o.cname)t.push("Հաճախորդ՝ "+o.cname+(c&&c.tin?" (ՀՎՀՀ "+c.tin+")":""));
 t.push(L);o.items.forEach(function(s){t.push(s.name+" × "+s.qty+" = "+fmt(s.qty*s.price))});t.push(L);
 if(o.disc)t.push("Զեղչ՝ "+o.disc+"%");
 t.push("Ընդամենը՝ "+fmt(o.total),"Վճարված՝ "+fmt(paid(o)));
 if(debt(o)>0)t.push("Պարտք՝ "+fmt(debt(o)));
 lastRcpt=t.join("\n");
 openOv('<h2 style="margin-top:0">Անդորրագիր</h2><pre>'+esc(lastRcpt)+'</pre><div class="row"><button onclick="shareText(lastRcpt)">Կիսվել</button><button class="ghost" onclick="closeOv()">Փակել</button></div>');
}
/* ---------- route ---------- */
var rday=null;
function vRoute(){
 if(rday===null){var g=new Date().getDay();rday=g===0?0:g-1}
 var L=S.customers.filter(function(c){return(c.days||[]).indexOf(rday)>-1});
 var h='<h1>Երթուղի</h1><div class="chips">'+DAYS.map(function(d,i){return '<button class="'+(i===rday?"on":"")+'" onclick="rday='+i+';render()">'+d+'</button>'}).join("")+'</div>';
 if(!L.length)return h+'<div class="empty">Այս օրվա համար հաճախորդ նշանակված չէ։ Օրերը նշեք «Հաճախորդներ» բաժնում։</div>';
 return h+L.map(function(c,i){var last=S.orders.find(function(o){return o.cid===c.id}),d=custDebt(c.id);
  return '<div class="card"><div class="item"><div><b>'+(i+1)+'. '+esc(c.name)+'</b><small>'+esc(c.phone||"")+(last?' · վերջին՝ '+dshort(last.date):' · պատվեր չի եղել')+'</small>'+(d>0?'<small class="low">Պարտք՝ '+fmt(d)+'</small>':'')+'</div><div><button class="ghost" onclick="mv(\''+c.id+'\',-1)">▲</button> <button class="ghost" onclick="mv(\''+c.id+'\',1)">▼</button></div></div><button style="width:100%" onclick="preCid=\''+c.id+'\';go(\'sales\')">Պատվեր</button></div>'}).join("");
}
function mv(id,dir){
 var L=S.customers.filter(function(c){return(c.days||[]).indexOf(rday)>-1}),i=L.findIndex(function(c){return c.id===id}),j=i+dir;if(j<0||j>=L.length)return;
 var a=S.customers.indexOf(L[i]),b=S.customers.indexOf(L[j]),t=S.customers[a];S.customers[a]=S.customers[b];S.customers[b]=t;save();render();
}
/* ---------- debts ---------- */
var payId=null;
function vDebts(){
 var L=S.orders.filter(function(o){return debt(o)>0}).sort(function(a,b){return new Date(a.date)-new Date(b.date)}),t=0;L.forEach(function(o){t+=debt(o)});
 var h='<h1>Պարտքեր</h1><div class="stat" style="margin-bottom:12px"><b>'+fmt(t)+'</b><span>Ընդհանուր պարտք</span></div>';
 if(!L.length)return h+'<div class="empty">Չմարված պարտք չկա։</div>';
 return h+L.map(function(o){var d=debt(o);
  return '<div class="card"><div class="item"><div><b>'+esc(o.cname||"—")+'</b><small>Պատվեր՝ '+dfull(o.date)+' · '+fmt(o.total)+'</small></div><div class="amt low">'+fmt(d)+'</div></div>'
  +(payId===o.id?'<div class="row"><div><label>Գումար</label><input id="pa" type="number" min="0" value="'+d+'"></div><div><label>Վճարման օրը</label><input id="pdt" type="date" value="'+dkey(new Date())+'"></div></div><div class="row"><button onclick="payDebt(\''+o.id+'\')">Հաստատել</button><button class="ghost" onclick="payId=null;render()">Չեղարկել</button></div>':'<button style="width:100%" onclick="payId=\''+o.id+'\';render()">Վճարում</button>')+'</div>'}).join("");
}
function payDebt(id){
 var o=S.orders.find(function(x){return x.id===id}),a=Math.min(debt(o),+$("pa").value);if(!(a>0))return;
 var v=$("pdt").value,d=v?new Date(v+"T12:00:00"):new Date();
 o.pays.push({date:d.toISOString(),amt:a});payId=null;save();render();
}
/* ---------- calendar ---------- */
var calM=null;
function calMove(k){var p=calM.split("-"),d=new Date(+p[0],+p[1]-1+k,1);calM=d.getFullYear()+"-"+n2(d.getMonth()+1);render()}
function monthOrders(){return S.orders.filter(function(o){return dkey(o.date).slice(0,7)===calM})}
function vCal(){
 if(!calM)calM=dkey(new Date()).slice(0,7);
 var os=monthOrders(),days={},tot=0,db=0;
 os.forEach(function(o){var k=dkey(o.date);(days[k]=days[k]||[]).push(o);tot+=o.total;db+=debt(o)});
 var p=calM.split("-"),h='<h1>Օրացույց</h1><div class="row" style="margin:0 0 12px"><button class="ghost" onclick="calMove(-1)">◀</button><b style="text-align:center;flex:2;padding-top:6px">'+p[1]+'.'+p[0]+'</b><button class="ghost" onclick="calMove(1)">▶</button></div>'
 +'<div class="stats" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px"><div class="stat"><b>'+fmt(tot)+'</b><span>Ամսվա վաճառք</span></div><div class="stat"><b>'+fmt(db)+'</b><span>Այս ամսվա պարտք</span></div></div>'
 +'<div class="card"><div class="row" style="margin-top:0"><button onclick="exportCSV(monthOrders(),\'amis-\'+calM)">Excel (ամիս)</button><button onclick="backup()">Պահուստ</button></div><div class="row"><button class="ghost" onclick="$(\'rf\').click()">Վերականգնել պահուստից</button><input id="rf" type="file" accept=".json,application/json" style="display:none" onchange="restore(this)"></div><small style="margin-top:8px">«Excel»-ը և «Պահուստ»-ը բացում են ուղարկելու ընտրացանկը՝ փոստ, Telegram, Drive և այլն։</small></div>';
 var ks=Object.keys(days).sort().reverse();
 if(!ks.length)return h+'<div class="empty">Այս ամսում պատվերներ չկան։</div>';
 return h+ks.map(function(k){var L=days[k],t=0;L.forEach(function(o){t+=o.total});
  return '<details class="card"><summary><span>📁 '+dshort(k+"T12:00:00")+'<small>'+L.length+' պատվեր</small></span><span class="amt">'+fmt(t)+'</span></summary>'+ordersHTML(L,true)+'<button class="ghost" onclick="exportCSV(S.orders.filter(function(o){return dkey(o.date)===\''+k+'\'}),\'oris-'+k+'\')">Արտահանել օրը (Excel)</button></details>'}).join("");
}
/* ---------- customers ---------- */
var editCid=null;
function vCust(){
 var c=editCid?cust(editCid):{},d=c.days||[];
 return '<h1>Հաճախորդներ</h1><div class="card"><div class="row" style="margin-top:0"><div><label>Անուն</label><input id="cn" value="'+esc(c.name)+'"></div><div><label>Կազմակերպություն</label><input id="cc" value="'+esc(c.company)+'"></div></div><div class="row"><div><label>ՀՎՀՀ</label><input id="ct" inputmode="numeric" value="'+esc(c.tin)+'"></div><div><label>Հեռախոս</label><input id="cp" type="tel" value="'+esc(c.phone)+'"></div></div>'
 +'<label style="margin-top:8px">Երթուղու օրեր</label><div class="chips">'+DAYS.map(function(n,i){return '<label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" id="cd'+i+'" '+(d.indexOf(i)>-1?"checked":"")+'>'+n+'</label>'}).join("")+'</div>'
 +'<button style="width:100%" onclick="saveCust()">'+(editCid?"Պահպանել փոփոխությունը":"Ավելացնել հաճախորդ")+'</button>'+(editCid?'<button class="ghost" style="width:100%;margin-top:6px" onclick="editCid=null;render()">Չեղարկել</button>':'')+'</div>'
 +'<input id="cs" placeholder="Որոնում՝ անուն, հեռախոս, ՀՎՀՀ" oninput="drawCust()" style="margin-bottom:12px"><div id="clist"></div>';
}
function drawCust(){
 var q=($("cs")?$("cs").value:"").toLowerCase(),L=S.customers.filter(function(c){return!q||[c.name,c.company,c.phone,c.tin].join(" ").toLowerCase().indexOf(q)>-1});
 $("clist").innerHTML=L.length?L.map(function(c){var mine=S.orders.filter(function(o){return o.cid===c.id}),d=custDebt(c.id),t=0;mine.forEach(function(o){t+=o.total});
  return '<details class="card"><summary><span>'+esc(c.name)+'<small>'+[c.company,c.tin?"ՀՎՀՀ "+c.tin:"",c.phone].filter(Boolean).map(esc).join(" · ")+' · պատվեր՝ '+mine.length+'</small></span><span class="amt'+(d>0?" low":"")+'">'+(d>0?"Պարտք "+fmt(d):fmt(t))+'</span></summary>'
  +'<small style="margin-bottom:8px">Երթուղի՝ '+((c.days||[]).map(function(i){return DAYS[i]}).join(", ")||"նշված չէ")+'</small>'+ordersHTML(mine,false)
  +'<div class="row"><button class="ghost" onclick="editCid=\''+c.id+'\';render()">Խմբագրել</button><button class="ghost" onclick="delCust(\''+c.id+'\')">Ջնջել</button></div></details>'}).join(""):'<div class="empty">Հաճախորդ չկա։</div>';
}
function saveCust(){
 var n=$("cn").value.trim();if(!n){$("cn").focus();return}
 var t=$("ct").value.trim();if(t&&!/^\d{8}$/.test(t)&&!confirm("ՀՎՀՀ-ն 8 թվանշան չէ։ Այնուամենայնիվ պահպանե՞լ։"))return;
 var days=[];for(var i=0;i<6;i++)if($("cd"+i).checked)days.push(i);
 var o={name:n,company:$("cc").value.trim(),tin:t,phone:$("cp").value.trim(),days:days};
 if(editCid){var c=cust(editCid);Object.assign(c,o);S.orders.forEach(function(x){if(x.cid===c.id)x.cname=c.name})}else{o.id=uid();S.customers.push(o)}
 editCid=null;save();render();
}
function delCust(id){if(!confirm("Ջնջե՞լ հաճախորդին։ Նրա պատվերները կմնան օրացույցում։"))return;S.customers=S.customers.filter(function(c){return c.id!==id});save();render()}
/* ---------- stock ---------- */
var editPid=null;
function vStock(){
 var p=editPid?prod(editPid):{};
 return '<h1>Ապրանքների պաշար</h1><div class="card"><div class="row" style="margin-top:0"><div><label>Անվանում</label><input id="pn" value="'+esc(p.name)+'"></div><div><label>Տեսակ</label><input id="pc" list="cl" placeholder="Ընդհանուր" value="'+esc(p.cat)+'"><datalist id="cl">'+Object.keys(S.products.reduce(function(o,x){o[x.cat||"Ընդհանուր"]=1;return o},{})).map(function(k){return '<option value="'+esc(k)+'">'}).join("")+'</datalist></div></div><div class="row"><div><label>Գին (֏)</label><input id="pp" type="number" min="0" value="'+esc(p.price)+'"></div><div><label>Քանակ</label><input id="ps" type="number" min="0" value="'+(editPid?p.stock:0)+'"></div></div><button style="margin-top:8px;width:100%" onclick="saveProd()">'+(editPid?"Պահպանել փոփոխությունը":"Ավելացնել ապրանք")+'</button>'+(editPid?'<button class="ghost" style="width:100%;margin-top:6px" onclick="editPid=null;render()">Չեղարկել</button>':'')+'</div>'
 +'<input id="ss" placeholder="Որոնում՝ ապրանքի անուն կամ տեսակ" oninput="drawStock()" style="margin-bottom:12px"><div id="slist"></div>';
}
function drawStock(){
 var q=($("ss")?$("ss").value:"").toLowerCase(),cs={};
 S.products.filter(function(p){return!q||(p.name+" "+(p.cat||"")).toLowerCase().indexOf(q)>-1}).forEach(function(p){var k=p.cat||"Ընդհանուր";(cs[k]=cs[k]||[]).push(p)});
 var h="";Object.keys(cs).forEach(function(k){h+='<h2>'+esc(k)+'</h2><div class="card">'+cs[k].map(function(p){return '<div class="item"><div>'+esc(p.name)+'<small>'+fmt(p.price)+' · <span class="'+(p.stock<=3?"low":"")+'">'+p.stock+' հատ'+(p.stock<=3?" (քիչ է)":"")+'</span></small></div><div><button class="ghost" onclick="restock(\''+p.id+'\')">+</button> <button class="ghost" onclick="editPid=\''+p.id+'\';render()">Խմբ.</button> <button class="ghost" onclick="delProd(\''+p.id+'\')">Ջնջել</button></div></div>'}).join("")+'</div>'});
 $("slist").innerHTML=h||'<div class="empty">Ապրանք չկա։</div>';
}
function saveProd(){
 var n=$("pn").value.trim(),pr=+$("pp").value;if(!n||$("pp").value===""||!(pr>=0)){$("pn").focus();return}
 var o={name:n,cat:$("pc").value.trim()||"Ընդհանուր",price:pr,stock:Math.floor(+$("ps").value)||0};
 if(editPid)Object.assign(prod(editPid),o);else{o.id=uid();S.products.push(o)}
 editPid=null;save();render();
}
function restock(id){var v=prompt("Քանի՞ հատ ավելացնել պաշարին։","10"),n=Math.floor(+v);if(v&&n>0){prod(id).stock+=n;save();drawStock()}}
function delProd(id){if(!confirm("Ջնջե՞լ ապրանքը։"))return;S.products=S.products.filter(function(p){return p.id!==id});save();render()}
/* ---------- report ---------- */
function vReport(){
 var now=new Date(),tk=dkey(now),mk=tk.slice(0,7),day=0,mon=0,all=0,db=0,by={},top={};
 S.orders.forEach(function(o){var k=dkey(o.date);all+=o.total;db+=debt(o);if(k===tk)day+=o.total;if(k.slice(0,7)===mk)mon+=o.total;by[k]=(by[k]||0)+o.total;o.items.forEach(function(s){top[s.name]=(top[s.name]||0)+s.qty*s.price})});
 var days=[],i,max=1;
 for(i=6;i>=0;i--){var d=new Date(now);d.setDate(d.getDate()-i);var v=by[dkey(d)]||0;days.push([d,v]);if(v>max)max=v}
 var svg='<svg viewBox="0 0 300 130" width="100%">'+days.map(function(x,j){var h=Math.round(x[1]/max*90),X=j*43+8;return '<rect x="'+X+'" y="'+(100-h)+'" width="30" height="'+h+'" rx="4" fill="var(--accent)"/><text x="'+(X+15)+'" y="116" text-anchor="middle">'+n2(x[0].getDate())+"."+n2(x[0].getMonth()+1)+'</text>'+(x[1]?'<text x="'+(X+15)+'" y="'+(96-h)+'" text-anchor="middle">'+(x[1]>=1000?Math.round(x[1]/1000)+"k":x[1])+'</text>':"")}).join("")+"</svg>";
 var tops=Object.keys(top).map(function(k){return[k,top[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,5);
 var sv=S.products.reduce(function(a,p){return a+p.price*p.stock},0);
 return '<h1>Հաշվետվություն</h1><div class="stats"><div class="stat"><b>'+fmt(day)+'</b><span>Այսօր</span></div><div class="stat"><b>'+fmt(mon)+'</b><span>Այս ամիս</span></div><div class="stat"><b>'+fmt(all)+'</b><span>Ընդամենը</span></div></div>'
 +'<div class="stats" style="grid-template-columns:repeat(2,1fr);margin-top:8px"><div class="stat"><b class="low">'+fmt(db)+'</b><span>Պարտքեր</span></div><div class="stat"><b>'+fmt(sv)+'</b><span>Պաշարի արժեք</span></div></div>'
 +'<h2>Վերջին 7 օրը (֏)</h2><div class="card">'+svg+'</div><h2>Ամենաշատ վաճառվածները</h2><div class="card">'+(tops.length?tops.map(function(t){return '<div class="item"><div>'+esc(t[0])+'</div><span class="amt">'+fmt(t[1])+'</span></div>'}).join(""):'<div class="empty">Տվյալներ դեռ չկան։</div>')+'</div>';
}
render();
</script>
</body>
</html>
